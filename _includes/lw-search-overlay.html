{% if site.search == true %}
<div id="lw-search-overlay" class="lw-search-overlay" role="dialog" aria-modal="true" aria-label="Search" aria-hidden="true" inert>
  <div class="lw-search-overlay__panel">
    <div class="lw-search-overlay__top">
      {% include_cached search/search_form.html %}
      <button class="lw-icon-button lw-search-close" type="button" aria-label="Close search">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>
    <p class="lw-search-status" data-search-status role="status" aria-live="polite">Search titles, topics, and article text.</p>
  </div>
</div>
{% endif %}
