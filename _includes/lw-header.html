<header class="lw-header" role="banner">
  <div class="lw-header__inner">
    <button class="lw-icon-button lw-nav-toggle" type="button" aria-label="Open navigation" aria-controls="lw-left-nav" aria-expanded="false">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <a class="lw-header__brand" href="{{ '/' | relative_url }}">{{ site.title | default: site.name }}</a>
    {% if site.subtitle %}<span class="lw-header__subtitle">{{ site.subtitle }}</span>{% endif %}
    <div class="lw-header__actions">
      <button class="lw-icon-button lw-search-toggle" type="button" aria-label="Open search" aria-controls="lw-search-overlay" aria-expanded="false">
        <i class="fas fa-search" aria-hidden="true"></i>
      </button>
      {% include theme-toggle.html %}
    </div>
  </div>
</header>
